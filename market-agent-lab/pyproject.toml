[project]
name = "market-agent-lab"
version = "0.1.0"
description = "Paper-only multi-agent quantitative research laboratory"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "fastapi>=0.115", "lightgbm>=4.5", "numpy>=2.0", "openai-agents>=0.2", "pandas>=2.2", "pyarrow>=18", "pydantic>=2.9", "scikit-learn>=1.5", "streamlit>=1.40", "uvicorn>=0.32"]
[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
